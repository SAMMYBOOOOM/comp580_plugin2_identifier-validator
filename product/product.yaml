_ > nanoagent.plugin.v0001.ProductConfig:
tagline: Deterministic IBAN and ISBN-13 validation, with the checksum it should have had.

summary: >-
  Identifier Validator parses a single IBAN or ISBN-13 string and returns a
  fully typed record: the normalised identifier, a closed-taxonomy reason
  code, the structural fields (country code, check digits, BBAN, EAN prefix,
  body), and the check characters recomputed from the rest of the value.
  Every field is a pure function of the input, so the output can be verified
  field by field without an LLM, a network call, or any hidden state.

highlights:
  - ISO 13616 IBAN validation using the mod-97 rule plus the per-country length registry.
  - ISO 2108 ISBN-13 validation using the alternating 1/3 weighted sum and the 978/979 prefix rule.
  - A closed reason taxonomy (empty, invalid-characters, bad-format, bad-country, bad-length, check-digit-mismatch) so every rejection is unambiguous.
  - Emits computed_check, the correct check characters, which makes off-by-one checksum errors immediately visible.
  - Zero network access, zero API keys, zero filesystem writes.

steps:
  - "Pick the identifier family: pass kind as exactly \"iban\" or \"isbn13\". Lowercase, case-sensitive."
  - "Pass the raw identifier: spaces are ignored for both families; hyphens are ignored for ISBN-13. All other characters are significant."
  - "Read the record: valid is true only when reason is null. For rejected inputs, reason names the first rule that failed and computed_check shows the expected check characters."